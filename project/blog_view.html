<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>네이버 블로그</title>
    <style>
        @keyframes view_on {
            0% { background: rgba(0,0,0,0.5); }
            50% { background: #999; }
            100% { background: rgba(0,0,0,0.5); }
        }
        html { scroll-behavior: smooth; }
        body { margin: 0; padding: 0; overflow-x: hidden; background: #fff; min-width: 320px; }
        #wrap { width: 70%; margin: 0 auto; }
        img { display: block; width: 100%; }
        .btn { position: fixed; right: 15%; bottom: 0; transform: translateX(60px); }
        .btn a { text-decoration: none; color: #fff; display: block; width: 60px; padding: 20px 0; text-align: center; }
        .btn a.view { background: rgba(0,0,0,0.5); font-size: 14px; animation: view_on 3s infinite; }
        .btn a.gotop { background: rgba(0,0,0,1); }
        .close {width: 20px; height: 20px; text-align: center; cursor: pointer;}
        .close img {width: 100%;}
    </style>
</head>

<body>
    <a name="top"></a>
    <div id="wrap">
        <div class="btn"><a href="https://blog.naver.com/guswjd9556" class="view">View</a><a href="#top" class="gotop">↑</a></div>
        <a href="../sub/PORTFOLIO.html"><img src="../img/blog.png" alt="네이버 블로그"></a>
        <div class="close"><img src="../img/view_close.png" alt="닫기"></div>
    </div>

    <script>
        $('.close').click(function(){
            $('.btn').fadeOut();
        });
    </script>

</body>
</html>
